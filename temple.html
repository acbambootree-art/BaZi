<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d1a17">
<title>歇腳廟｜線上拜拜、擲筊、求籤</title>
<meta name="description" content="一間不用說話的線上小廟。上香、擲筊、求籤、點光明燈，躺著也能拜拜。">
<meta property="og:title" content="歇腳廟，進來歇一下">
<meta property="og:description" content="一間不用說話的線上小廟。上香、擲筊、求籤、點光明燈。">
<meta property="og:locale" content="zh_TW">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 王漢宗顏楷 (Yan-style regular script, GPL v2), subset to the characters the temple uses */
  @font-face { font-family: "TempleKai"; src: url(/temple/assets/yankai.woff2) format("woff2"); font-display: swap;
    unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-9FFF, U+F900-FAFF, U+FF00-FFEF; }
  html { font-synthesis: none; }
  :root {
    --brush: "TempleKai", "LXGW WenKai TC", "Noto Serif TC", "Noto Sans TC", serif;   /* 顏楷 for Chinese, brush-style Latin for English */
    --ink: #2b211b; --paper: rgba(250, 244, 233, 0.92); --line: rgba(80, 50, 30, 0.18);
    --red: #b8231a; --gold: #c9952f; --muted: #7a6a5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e4e7e6; color: var(--ink);
    font-family: var(--brush); }
  #app { position: fixed; inset: 0; touch-action: none; }
  #app canvas { display: block; }
  .glass { background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  #top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
    display: flex; justify-content: space-between; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #brand { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 14px; }
  #brand b { font-family: var(--brush); font-size: 17px; letter-spacing: 2px; }
  #count { color: var(--muted); font-variant-numeric: tabular-nums; }
  #sound { width: 44px; height: 44px; display: grid; place-items: center; font-size: 18px; }

  #hint { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 58px); left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 13px; text-shadow: 0 1px 4px rgba(0,0,0,0.7); white-space: nowrap; transition: opacity 1s; }

  #bar { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 6px 8px; border-radius: 22px; max-width: calc(100vw - 24px); }
  #bar button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 6px 4px;
    border-radius: 14px; font-size: 12px; }
  #bar button span { font-size: 20px; line-height: 1.1; }
  #bar button:hover, #bar button:focus-visible { background: rgba(184, 35, 26, 0.1); outline: none; }
  #bar button.on { background: rgba(184, 35, 26, 0.14); }
  #bar button:disabled { opacity: 0.4; }

  #toast { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -10px); opacity: 0;
    padding: 10px 20px; border-radius: 999px; font-size: 15px; transition: all .4s; pointer-events: none;
    font-family: var(--brush); white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  #modal { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center;
    background: rgba(20, 12, 8, 0.35); padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  #modal.on { display: flex; }
  .card { width: 100%; max-width: 420px; max-height: 82vh; overflow: auto; border-radius: 20px; padding: 22px 22px 18px;
    background: #faf4e9; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
  .card h2 { font-family: var(--brush); margin: 0 0 6px; font-size: 22px; letter-spacing: 1px; }
  .card p { margin: 6px 0; line-height: 1.7; font-size: 15px; }
  .card .muted { color: var(--muted); font-size: 13px; }
  .card label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .card input, .card select { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 500; text-align: center; text-decoration: none; }
  .btn.primary { background: var(--red); color: #fff; }
  .btn.ghost { background: rgba(0,0,0,0.05); }
  .poem { font-family: var(--brush); font-size: 20px; line-height: 1.9; text-align: center; letter-spacing: 3px;
    margin: 14px 0; padding: 14px 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .result { font-family: var(--brush); font-size: 34px; text-align: center; color: var(--red); margin: 10px 0 0; letter-spacing: 6px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: rgba(184,35,26,0.1); color: var(--red); font-size: 13px; }

  .nametag { padding: 3px 9px; border-radius: 999px; background: rgba(250,244,233,0.88); color: var(--ink);
    font-size: 11px; white-space: nowrap; border: 1px solid var(--line); pointer-events: none; }
  .nametag.me::before { content: "我"; display: inline-block; margin-right: 5px; padding: 0 5px; border-radius: 99px;
    background: var(--red); color: #fff; font-size: 10px; }

  html[lang="en"] .nametag.me::before { content: "Me"; }
  html[lang="en"] .result { font-size: 28px; letter-spacing: 2px; }
  #brand { white-space: nowrap; }
  html[lang="en"] #brand b { letter-spacing: 0.5px; font-size: 16px; }
  @media (max-width: 400px) { html[lang="en"] #brand { gap: 7px; padding: 8px 12px; font-size: 13px; } }
  #credits { position: fixed; right: 14px; bottom: max(22px, env(safe-area-inset-bottom)); width: 30px; height: 30px; border-radius: 50%; color: #fff; opacity: 0.7; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  @media (max-width: 640px) { #credits { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 96px); right: 18px; } }
  #joy { position: fixed; left: max(22px, env(safe-area-inset-left)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 92px);
    width: 112px; height: 112px; border-radius: 50%; background: rgba(250,244,233,0.16); border: 1.5px solid rgba(250,244,233,0.45);
    touch-action: none; display: grid; place-items: center; transition: background .2s; }
  #joy.on { background: rgba(250,244,233,0.26); }
  #joyKnob { width: 46px; height: 46px; border-radius: 50%; background: rgba(250,244,233,0.85); box-shadow: 0 2px 10px rgba(0,0,0,.3); pointer-events: none; transition: transform .12s ease-out; }
  #joy.on #joyKnob { transition: none; }
  #rest { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #d9d4c8; color: var(--ink); font-size: 15px; }
  #rest.on { display: flex; }
  /* while the world loads you float in clouds (drawn in three.js); this is only the quiet title over them */
  #intro { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: grid; place-items: center; transition: opacity 2.5s; }
  #intro .t { font: 13vmin/1 var(--brush); letter-spacing: 3vmin; color: rgba(110, 86, 60, .55); text-shadow: 0 0 24px rgba(255,255,255,.9); translate: 1.5vmin 0; }
  #intro .msg { position: absolute; left: 50%; bottom: 12%; translate: -50% 0; text-align: center; color: rgba(90, 76, 60, .7);
    font: 14px/1.6 var(--brush); letter-spacing: 3px; white-space: nowrap; }
  #intro .bar { width: 160px; height: 1px; margin: 8px auto 0; background: rgba(90,76,60,.18); }
  #intro .bar i { display: block; height: 100%; width: 0; background: rgba(90,76,60,.6); transition: width .5s; }
  #intro.out { opacity: 0; }
  #intro .msg { opacity: 0; transition: opacity .8s; }
  #intro.waiting .msg { opacity: 1; }
  #enter { position: absolute; left: 50%; top: calc(50% + 11vmin); translate: -50% 0; pointer-events: auto; cursor: pointer;
    padding: 12px 34px; border-radius: 999px; border: 1px solid rgba(110, 86, 60, .35); background: rgba(250, 246, 238, .72);
    color: rgba(80, 62, 44, .9); font: 17px/1 var(--brush); letter-spacing: 6px; box-shadow: 0 6px 24px rgba(90, 80, 60, .12);
    backdrop-filter: blur(4px); transition: opacity .8s, background .3s; }
  #enter:hover, #enter:focus-visible { background: rgba(255, 252, 245, .92); outline: none; }
  #intro.waiting #enter { opacity: 0; pointer-events: none; }
  body.intro #top, body.intro #bar, body.intro #hint, body.intro #credits, body.intro #joy, body.intro .nametag { opacity: 0; pointer-events: none; }
  #top, #bar, #hint, #credits, #joy { transition: opacity 1.5s; }
</style>
</head>
<body class="intro">
<div id="app"></div>

<div id="top">
  <div id="brand" class="glass"><b>歇腳廟</b><span id="room">第 1 殿</span><span id="count">1/100</span></div>
  <div style="display:flex;gap:8px"><button id="lang" class="glass" aria-label="Language / 語言" style="width:44px;height:44px;font-weight:600;font-size:14px">EN</button>
  <button id="sound" class="glass" aria-label="Sound / 聲音">🔈</button></div>
</div>
<div id="hint">點地面走路・拖曳環顧・雙指縮放</div>

<nav id="bar" class="glass" aria-label="動作">
  <button data-act="bai"><span>🙏</span>拜拜</button>
  <button data-act="sit"><span>🧘</span>坐下</button>
  <button data-act="incense"><span>🪔</span>上香</button>
  <button data-act="jiao"><span>🌙</span>擲筊</button>
  <button data-act="qian"><span>🎋</span>求籤</button>
  <button data-act="lamp"><span>🪷</span>祈福</button>
  <button data-act="muyu"><span>🐟</span>木魚</button>
</nav>

<button id="credits" aria-label="Credits">ⓘ</button>
<div id="toast" class="glass"></div>
<div id="modal"><div class="card" id="card"></div></div>
<div id="rest"><div>你在廟裡歇著</div><button class="btn primary" id="wake" style="flex:none;padding:10px 22px">回到廟裡</button></div>
<div id="intro"><div class="t">歇腳廟</div><button id="enter">入 廟</button><div class="msg"><span id="gateMsg">雲 開 中</span><div class="bar"><i id="gateBar"></i></div></div></div>
<script>
  // catch the Enter click at once (the 3D scene may still be loading); the click is also what may start audio
  window.__enter = new Promise((res) => document.getElementById('enter').addEventListener('click', () => {
    try { window.__actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    document.getElementById('intro').classList.add('waiting');
    res();
  }, { once: true }));
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module" src="/temple/main.js"></script>
</body>
</html>
